<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 78" width="220" height="78"
     fill="none" stroke="#3aa8c1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Urriði (Brown trout) — Salmo trutta
    Standalone reference file. Stroke colour matches site accent #3aa8c1.
    Inline version in index.html uses currentColor.
    PLACEHOLDER: replace path data with final naturalistic artwork.
    Keep viewBox="0 0 220 78" and stroke="currentColor" in the inline copy.
    Differences from bleikja: heavier body, denser spots, shallower tail fork.
  -->

  <!-- Body: heavier build than bleikja, less forked tail -->
  <path d="
    M 14,39
    C 12,33 12,26 17,23
    C 22,19 36,15 62,13
    C 90,10 122,10 152,14
    C 170,18 183,26 188,34
    C 192,26 198,19 204,16
    C 202,21 200,27 199,33
    C 198,36 198,38 198,39
    C 198,40 198,42 199,45
    C 200,51 202,57 204,62
    C 198,59 192,52 188,44
    C 183,52 170,60 152,64
    C 122,68 90,68 62,65
    C 36,63 22,59 17,55
    C 12,52 12,45 14,39 Z
  "/>

  <!-- Dorsal fin (larger, more rayed on trout) -->
  <path d="M 88,10 C 93,2 112,-1 124,3 C 129,6 127,13 120,14"/>

  <!-- Adipose fin -->
  <path d="M 162,14 C 165,8 172,8 174,14"/>

  <!-- Pectoral fin -->
  <path d="M 50,29 C 46,38 49,50 58,48 C 55,44 52,37 50,29"/>

  <!-- Pelvic fin -->
  <path d="M 90,66 C 88,74 94,78 99,76 C 96,73 93,70 90,66"/>

  <!-- Anal fin -->
  <path d="M 136,64 C 135,73 141,77 146,75 C 143,72 139,68 136,64"/>

  <!-- Eye -->
  <circle cx="27" cy="34" r="3.2"/>
  <circle cx="27" cy="34" r="1.1" fill="#3aa8c1" stroke="none"/>

  <!-- Gill cover -->
  <path d="M 40,24 C 38,32 38,50 40,58" stroke-width="1"/>

  <!-- Lateral line -->
  <path d="M 55,37 C 98,34 152,35 190,38" stroke-dasharray="3,4" stroke-width="0.7"/>

  <!-- Spots: dense, trout has black spots + smaller red spots -->
  <circle cx="80"  cy="29" r="2.4" fill="#3aa8c1" stroke="none"/>
  <circle cx="100" cy="27" r="2.4" fill="#3aa8c1" stroke="none"/>
  <circle cx="120" cy="26" r="2.2" fill="#3aa8c1" stroke="none"/>
  <circle cx="140" cy="27" r="2.2" fill="#3aa8c1" stroke="none"/>
  <circle cx="160" cy="30" r="1.8" fill="#3aa8c1" stroke="none"/>
  <circle cx="88"  cy="44" r="2.4" fill="#3aa8c1" stroke="none"/>
  <circle cx="108" cy="45" r="2.2" fill="#3aa8c1" stroke="none"/>
  <circle cx="128" cy="44" r="2"   fill="#3aa8c1" stroke="none"/>
  <circle cx="150" cy="41" r="1.8" fill="#3aa8c1" stroke="none"/>
  <circle cx="94"  cy="36" r="1.4" fill="#3aa8c1" stroke="none"/>
  <circle cx="114" cy="36" r="1.4" fill="#3aa8c1" stroke="none"/>
  <circle cx="134" cy="36" r="1.2" fill="#3aa8c1" stroke="none"/>
</svg>
